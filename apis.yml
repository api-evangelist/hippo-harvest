aid: hippo-harvest
name: Hippo Harvest
description: >-
  Hippo Harvest is a controlled-environment agriculture company based in Pescadero, California,
  founded in 2019, that grows USDA-certified-organic leafy greens in modular greenhouses run by
  custom autonomous mobile robots and machine learning. Its closed-loop, direct-to-root watering
  and nutrient system is published by the company as using 92% less water, 55% less fertilizer and
  94% less land than conventional field agriculture, while pricing to compete with field-grown
  product. Hippo Harvest sells packaged salad greens (spring mix, spinach, 50/50 blend, butter
  lettuce) into grocery retail rather than selling software: the robotics, computer vision and
  growing-control stack is internal operating infrastructure, not a product. It raised a $21M
  Series B led by Standard Investments in February 2024 and a $30M Series C led by Cox Farms in
  July 2026, and is permitting a 30-acre facility in Hollister, California. No public API,
  developer portal, SDK or machine-readable contract of any kind was found on any host the
  company controls.
